name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Swift 6.2 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode 26.2
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Install Swift 6.2
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: '6.2.0'
      - name: Report toolchain
        run: swift --version
      - name: Test library and protected specification corpora
        run: swift test
      - name: Build optimized library
        run: swift build -c release
      - name: Test offline development scripts
        run: python3 -I -m unittest discover -s Scripts

  documentation:
    name: DocC / Swift 6.2
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode 26.2
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Build all public documentation with warnings as errors
        run: python3 -I Scripts/build_documentation.py --output-dir "$RUNNER_TEMP/gmsetzer-documentation"
      - name: Check the public source API against the reviewed candidate
        run: python3 -I Scripts/check_public_api.py --graph-dir "$RUNNER_TEMP/gmsetzer-documentation/symbolgraph"
