name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a versioned release from main with release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
          test -s "Docs/Releases/${RELEASE_TAG#v}.md"

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  draft:
    name: Create source-only release draft
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create draft for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # An existing draft or published release is left untouched on reruns.
          if gh release view "$RELEASE_TAG" --json url --jq .url; then
            exit 0
          fi
          options=()
          if [[ "$RELEASE_TAG" == v0.* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft "${options[@]}" \
            --title "GMSetzer $RELEASE_TAG" \
            --notes-file "Docs/Releases/${RELEASE_TAG#v}.md"
